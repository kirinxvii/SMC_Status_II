<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>SMC_Status 即時地圖</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; }
        #leaflet-map { height: 100vh; width: 100%; }
        
        /* 標記與圓圈樣式 */
        .marker-icon { border-radius: 50%; box-shadow: 0 0 5px rgba(0,0,0,0.5); pointer-events: none; background: transparent; }
        .solid-circle { background-color: #28a745 !important; border: 2px solid white !important; }
        .yellow-circle { background-color: #ffc107 !important; border: 2px solid white !important; }
        
        /* 文字標籤樣式 */
        .text-label { font-size: 11px; font-weight: bold; color: #000; text-align: center; background: rgba(255, 255, 255, 0.7); border-radius: 3px; padding: 1px 3px; white-space: nowrap; }
    </style>
</head>
<body>
    <div id="leaflet-map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>

    <script>
        const map = L.map('leaflet-map');
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap' }).addTo(map);

        // 所有點位座標
        const points = {
            "OSS": [24.0868, 120.2074], "WTG01": [24.1200, 120.1885], "WTG02": [24.0999, 120.1728], "WTG03": [24.0797, 120.1572],
            "WTG04": [24.1188, 120.1963], "WTG05": [24.0990, 120.1811], "WTG06": [24.0793, 120.1659], "WTG07": [24.0596, 120.1507],
            "WTG08": [24.1176, 120.2041], "WTG09": [24.0982, 120.1893], "WTG10": [24.0789, 120.1746], "WTG11": [24.0596, 120.1598],
            "WTG12": [24.1163, 120.2119], "WTG13": [24.0974, 120.1976], "WTG14": [24.0786, 120.1833], "WTG15": [24.0597, 120.1690],
            "WTG16": [24.1151, 120.2197], "WTG17": [24.0966, 120.2058], "WTG18": [24.0782, 120.1920], "WTG19": [24.0598, 120.1781],
            "WTG20": [24.1138, 120.2275], "WTG21": [24.0960, 120.2140], "WTG22": [24.0778, 120.2007], "WTG23": [24.0598, 120.1872],
            "WTG24": [24.1126, 120.2353], "WTG25": [24.0950, 120.2223], "WTG26": [24.0775, 120.2094], "WTG27": [24.0599, 120.1964],
            "WTG28": [24.1113, 120.2431], "WTG29": [24.0942, 120.2306], "WTG30": [24.0771, 120.2181], "WTG31": [24.0600, 120.2055]
        };

        const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vR0MC7HzAbxdqTrZNqIpaBtcyCIr8gV3vVm2pan8j2QFIlrHP2qzzqDb15LE9EqlrxcxQGuc6vphXDJ/pub?output=csv';

        function getOffsetPoint(p1, p2, ratio) {
            return [p1[0] + (p2[0] - p1[0]) * ratio, p1[1] + (p2[1] - p1[1]) * ratio];
        }

        // 讀取 CSV 並執行繪製
        Papa.parse(CSV_URL + '&t=' + new Date().getTime(), {
            download: true, header: true,
            complete: function(results) {
                // 1. 繪製線條
                results.data.forEach(row => {
                    if (!row.Key) return;
                    const pair = row.Key.split('-');
                    if (!points[pair[0]] || !points[pair[1]]) return;

                    if (row.Type === 'green') {
                        L.polyline([points[pair[0]], points[pair[1]]], { color: 'green', weight: 3 }).addTo(map);
                    } else {
                        L.polyline([points[pair[0]], points[pair[1]]], { color: 'black', weight: 2, dashArray: '5, 10' }).addTo(map);
                        
                        // 處理圓圈標記
                        [row.Final_Start, row.Final_End].forEach((cls, index) => {
                            if (cls && cls.trim() !== "") {
                                L.marker(getOffsetPoint(points[pair[0]], points[pair[1]], [0.2, 0.8][index]), {
                                    icon: L.divIcon({ className: `marker-icon ${cls.trim()}`, iconSize: [20, 20] }),
                                    interactive: false
                                }).addTo(map);
                            }
                        });
                    }
                });

                // 2. 繪製點位符號與名稱
                Object.keys(points).forEach(name => {
                    // 點位符號
                    L.circleMarker(points[name], { radius: 5, fillColor: "#fff", color: "#000", weight: 1, fillOpacity: 0.8 }).addTo(map);
                    // 名稱標籤
                    L.marker(points[name], {
                        icon: L.divIcon({ className: 'text-label', html: `<b>${name}</b>`, iconSize: [40, 20], iconAnchor: [20, -10] })
                    }).addTo(map);
                });

                map.fitBounds(L.latLngBounds(Object.values(points)), { padding: [50, 50] });
            }
        });
    </script>
</body>
</html>
